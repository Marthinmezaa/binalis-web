<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- Small-size cut of src/components/BinalisSymbol.astro, no background: just the "b", filling the icon.
       Bolder strokes on a 16 px grid (10 units = 1 px): bar and ring edges land on whole pixels at 16, 32 and 48 px.
       Source of favicon.ico and apple-touch-icon.png: run `pnpm icons` after editing. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7B5CFF" />
    </linearGradient>
  </defs>
  <rect x="30" y="10" width="20" height="140" rx="10" fill="url(#g)" />
  <circle cx="80" cy="100" r="40" fill="none" stroke="url(#g)" stroke-width="20" />
</svg>
